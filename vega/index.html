<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VEGA System</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="さわって楽しむだけの、3D ホログラム AI アシスタント画面。">
<meta name="theme-color" content="#01060b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;500;700&family=M+PLUS+1+Code:wght@300;500&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: 全面に 3D ホログラム（WebGL）。上に細いステータスバー、下に音声ログと司令デッキ。HUD は透明で、操作はすべて 3D の上で */
:root {
  color-scheme: dark;
  --void: #01060b;
  --ink: #dffcff;
  --dim: #78a0ac;
  --white: 255 255 255;
  --shade: 0 0 0;
  --cyan: 92 236 255;
  --amber: 255 166 60;
  --red: 255 51 73;
  --acc: var(--cyan);
  --f-display: "Chakra Petch", "M PLUS 1 Code", "Hiragino Sans", system-ui, sans-serif;
  --f-data: "Share Tech Mono", "M PLUS 1 Code", ui-monospace, Menlo, monospace;
  --f-voice: "M PLUS 1 Code", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
}
html { height: 100%; box-sizing: border-box; background: var(--void); }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  height: 100%; margin: 0; overflow: hidden; color: var(--ink); font-family: var(--f-display); background: var(--void);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }

#stage { position: fixed; inset: 0; }
#gl, #ui2d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ui2d { z-index: 1; touch-action: none; cursor: crosshair; }

/* ── HUD ───────────────────────────── */
#hud {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#hud button { pointer-events: auto; }
#hud.jolt { animation: jolt .42s steps(3); }
@keyframes jolt {
  0% { transform: translate(8px, -5px) skewX(-2deg); }
  35% { transform: translate(-10px, 4px) skewX(2deg); }
  70% { transform: translate(3px, 2px); }
  100% { transform: none; }
}
.boot-in { opacity: 0; transition: opacity .5s; }
body.awake .boot-in { opacity: 1; animation: flickIn .9s both; animation-delay: var(--d, 0s); }
@keyframes flickIn {
  0% { opacity: 0; transform: scaleY(.02); }
  12% { opacity: 1; transform: scaleY(.02); }
  26% { opacity: .35; transform: scaleY(1); }
  32% { opacity: 1; } 40% { opacity: .15; } 48% { opacity: 1; } 62% { opacity: .7; }
  100% { opacity: 1; transform: none; }
}

.top {
  display: flex; align-items: center; gap: 16px; min-width: 0; padding-bottom: 10px;
  border-bottom: 1px solid transparent;
  border-image: linear-gradient(90deg, rgb(var(--acc) / .5), rgb(var(--acc) / .08) 40%, rgb(var(--acc) / .08) 60%, rgb(var(--acc) / .5)) 1;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 30px; height: 30px; flex: none; color: rgb(var(--acc)); filter: drop-shadow(0 0 6px rgb(var(--acc) / .9)); }
.logo { font: 700 21px/1 var(--f-display); letter-spacing: .42em; color: var(--ink); text-shadow: 0 0 14px rgb(var(--acc) / .9); }
.sub { margin-top: 5px; font: 500 9px/1.2 var(--f-display); letter-spacing: .26em; color: var(--dim); white-space: nowrap; }
.status { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid rgb(var(--acc) / .35); font: 11px/1 var(--f-data); letter-spacing: .22em; color: rgb(var(--acc)); white-space: nowrap; }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: rgb(var(--acc)); box-shadow: 0 0 8px rgb(var(--acc)); animation: blink 1.4s infinite; }
.clock { margin-left: auto; font: 20px/1 var(--f-data); letter-spacing: .08em; color: var(--ink); text-shadow: 0 0 10px rgb(var(--acc) / .7); font-variant-numeric: tabular-nums; }
.toggles { display: flex; gap: 6px; }
.toggles button {
  appearance: none; min-height: 32px; min-width: 32px; padding: 0 10px; cursor: pointer; display: grid; place-items: center;
  background: rgb(var(--acc) / .05); border: 1px solid rgb(var(--acc) / .4); color: rgb(var(--acc));
  font: 500 10px/1 var(--f-display); letter-spacing: .18em;
}
.toggles button svg { width: 15px; height: 15px; }
.toggles button[aria-pressed="false"] { color: var(--dim); border-color: rgb(var(--acc) / .14); text-decoration: line-through; }
.toggles button:focus-visible, .cmds button:focus-visible { outline: none; box-shadow: inset 0 0 0 2px rgb(var(--acc)); }

.mission {
  position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 66px); transform: translateX(-50%);
  display: flex; align-items: center; gap: 14px; padding: 8px 14px; white-space: nowrap;
  border: 1px solid rgb(var(--acc) / .45); background: rgb(var(--shade) / .55);
  font: 11px/1 var(--f-data); letter-spacing: .14em; color: var(--dim);
}
.mission b { font: 700 12px/1 var(--f-display); letter-spacing: .3em; color: rgb(var(--red)); animation: blink 1s infinite; }
.mission em { font-style: normal; font-size: 16px; color: var(--ink); }
.mission i { width: 80px; height: 4px; background: rgb(var(--acc) / .15); }
.mission s { display: block; height: 100%; width: 100%; background: rgb(var(--acc)); box-shadow: 0 0 8px rgb(var(--acc)); }

.core-hint {
  position: absolute; left: 0; right: 0; top: var(--hy, 70%); text-align: center;
  font: 300 10.5px/1 var(--f-voice); letter-spacing: .16em; color: var(--dim); white-space: nowrap;
}
.core-hint b { color: rgb(var(--acc)); font-weight: 500; }
body.mode-def .core-hint, body.awake.touched .core-hint { opacity: 0; transition: opacity 1s; animation: none; }

.deck { display: grid; justify-items: center; gap: 10px; min-width: 0; }
.voice {
  width: min(820px, 100%); height: 60px; display: flex; align-items: center; gap: 14px; padding: 0 16px;
  border-block: 1px solid rgb(var(--acc) / .25);
  background: linear-gradient(90deg, transparent, rgb(var(--shade) / .55) 15%, rgb(var(--shade) / .55) 85%, transparent);
}
.voice .who { flex: none; font: 700 12px/1 var(--f-display); letter-spacing: .3em; color: rgb(var(--acc)); }
.wave { flex: none; display: flex; align-items: center; gap: 2px; height: 18px; }
.wave i { width: 2px; height: 22%; background: rgb(var(--acc)); }
.voice.talking .wave i { animation: eq .42s ease-in-out infinite alternate; }
.wave i:nth-child(2) { animation-delay: -.12s; } .wave i:nth-child(3) { animation-delay: -.26s; }
.wave i:nth-child(4) { animation-delay: -.07s; } .wave i:nth-child(5) { animation-delay: -.33s; }
@keyframes eq { from { height: 15%; } to { height: 100%; } }
#say {
  flex: 1; min-width: 0; margin: 0; font: 400 15px/1.5 var(--f-voice); color: var(--ink); text-shadow: 0 0 12px rgb(var(--acc) / .55);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden;
}
.cmds { width: min(820px, 100%); display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.cmds button {
  appearance: none; position: relative; cursor: pointer; display: grid; justify-items: center; gap: 4px; padding: 9px 4px 8px;
  background: linear-gradient(180deg, rgb(var(--acc) / .1), rgb(var(--acc) / .03)); border: 1px solid rgb(var(--acc) / .45); color: var(--ink);
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  font: 700 clamp(9px, 2.5vw, 12.5px)/1 var(--f-display); letter-spacing: .12em; white-space: nowrap;
  transition: background .15s, transform .1s;
}
.cmds button svg { width: 20px; height: 20px; color: rgb(var(--acc)); filter: drop-shadow(0 0 4px rgb(var(--acc) / .8)); }
.cmds button small { font: 300 clamp(9px, 2.4vw, 10.5px)/1 var(--f-voice); letter-spacing: .06em; color: var(--dim); }
.cmds button:hover { background: rgb(var(--acc) / .18); }
.cmds button:active { transform: scale(.95); }
.cmds button.fire { animation: fire .5s ease-out; }
.cmds button.active { background: rgb(var(--acc) / .3); box-shadow: inset 0 0 18px rgb(var(--acc) / .7); }
.cmds button.active small { color: var(--ink); }
@keyframes fire { 0% { background: rgb(var(--acc) / .95); color: var(--void); } 100% { background: rgb(var(--acc) / .05); } }

/* ── 重ね表示 ──────────────────────── */
#banner {
  position: absolute; z-index: 3; left: var(--cx, 50%); top: var(--cy, 50%); transform: translate(-50%, -50%);
  display: grid; justify-items: center; gap: 8px; pointer-events: none; opacity: 0; text-align: center; white-space: nowrap;
}
#banner::before { content: ""; position: absolute; inset: -16px -70px; z-index: -1; background: linear-gradient(90deg, transparent, rgb(var(--shade) / .6) 22%, rgb(var(--shade) / .6) 78%, transparent); }
#banner b { font: 700 clamp(26px, 7.4vw, 76px)/1 var(--f-display); letter-spacing: .16em; padding-left: .16em; color: var(--ink); text-shadow: 0 0 16px rgb(var(--acc)), 0 0 44px rgb(var(--acc) / .75); }
#banner small { font: 500 clamp(11px, 2.8vw, 15px)/1 var(--f-voice); letter-spacing: .3em; color: rgb(var(--acc)); }
#banner.on { animation: bannerShow 2.4s ease-out both; }
#banner.on b { animation: glitch .45s steps(2) 2; }
@keyframes bannerShow {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(1.7); filter: blur(8px); }
  12% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: none; }
  78% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.04); }
}
@keyframes glitch {
  0% { clip-path: inset(10% 0 55% 0); transform: translateX(-7px); }
  25% { clip-path: inset(52% 0 18% 0); transform: translateX(6px); }
  50% { clip-path: inset(0 0 78% 0); transform: translateX(-3px); }
  75% { clip-path: inset(68% 0 0 0); transform: translateX(4px); }
  100% { clip-path: inset(0); transform: none; }
}

.hazard {
  position: fixed; left: 0; right: 0; z-index: 4; height: 14px; pointer-events: none; opacity: 0; transition: opacity .3s;
  background: repeating-linear-gradient(-45deg, rgb(var(--red) / .85) 0 12px, transparent 12px 24px);
}
.hazard.top { top: env(safe-area-inset-top, 0px); }
.hazard.bottom { bottom: env(safe-area-inset-bottom, 0px); }
body.mode-alert .hazard { opacity: 1; animation: hazard .6s linear infinite; }
@keyframes hazard { to { background-position: 33.94px 0; } }
.edge { position: fixed; inset: 0; z-index: 4; pointer-events: none; transition: box-shadow .6s; }
body.mode-alert .edge { animation: alarmGlow 1s ease-in-out infinite; }
body.mode-od .edge { box-shadow: inset 0 0 170px rgb(var(--amber) / .35); }
@keyframes alarmGlow { 0%, 100% { box-shadow: inset 0 0 60px rgb(var(--red) / .2); } 50% { box-shadow: inset 0 0 190px rgb(var(--red) / .6); } }

#bootlog {
  position: fixed; z-index: 7; margin: 0; pointer-events: none; opacity: 0; transition: opacity .6s;
  top: calc(env(safe-area-inset-top, 0px) + 18px); left: max(16px, env(safe-area-inset-left, 0px)); max-width: calc(100% - 32px); overflow: hidden;
  font: 11px/1.6 var(--f-data); color: rgb(var(--acc) / .9); white-space: pre; text-shadow: 0 0 8px rgb(var(--acc) / .6);
}
#bootlog.on { opacity: 1; }

#wake {
  position: fixed; inset: 0; z-index: 8; appearance: none; margin: 0; padding: 0; border: 0;
  background: transparent; cursor: pointer; transition: opacity .5s;
}
body.booting #wake, body.awake #wake { opacity: 0; pointer-events: none; }
body:not(.ready) #wake { cursor: default; }
.w-logo {
  position: absolute; left: var(--cx, 50%); top: var(--cy, 50%); transform: translate(-50%, -50%);
  font: 300 clamp(28px, 7vw, 60px)/1 var(--f-display); letter-spacing: .5em; padding-left: .5em; color: var(--ink);
  text-shadow: 0 0 24px rgb(var(--acc) / .95);
}
.w-cta { position: absolute; left: var(--cx, 50%); top: calc(var(--cy, 50%) + var(--cr, 140px) * .62 + 24px); transform: translateX(-50%); display: grid; justify-items: center; gap: 10px; }
.w-cta b { font: 500 13px/1 var(--f-display); letter-spacing: .5em; padding-left: .5em; color: rgb(var(--acc)); animation: breathe 2.2s ease-in-out infinite; white-space: nowrap; }
.w-cta small { font: 300 12px/1 var(--f-voice); letter-spacing: .3em; color: var(--dim); white-space: nowrap; }
body:not(.ready) .w-go, body.ready .w-load, body:not(.ready) .w-cta small { display: none; }
.w-top, .w-credit {
  position: absolute; left: 0; right: 0; text-align: center; letter-spacing: .3em; color: var(--dim);
}
.w-top { top: calc(env(safe-area-inset-top, 0px) + 20px); font: 11px/1 var(--f-data); }
.w-credit { bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); font: 9px/1 var(--f-data); letter-spacing: .2em; opacity: .7; }
.w-nogl { display: none; position: absolute; left: 50%; top: 62%; transform: translateX(-50%); width: min(320px, calc(100% - 32px)); font: 13px/1.7 var(--f-voice); color: var(--ink); }
body.no-gl .w-nogl { display: block; }
body.no-gl .w-cta { display: none; }
#wake:focus-visible .w-cta b { text-decoration: underline; text-underline-offset: 6px; }
@keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

/* ── 画面サイズ ───────────────────── */
@media (max-width: 640px) {
  .sub, .status { display: none; }
  .logo { font-size: 18px; letter-spacing: .36em; }
  .mark { width: 24px; height: 24px; }
  .clock { font-size: 15px; }
  .top { gap: 10px; }
  .toggles button { padding: 0 8px; }
  .voice { height: 66px; gap: 10px; padding: 0 10px; }
  .voice .who { letter-spacing: .2em; }
  #say { font-size: 13.5px; -webkit-line-clamp: 3; line-clamp: 3; }
  .cmds { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .cmds button { letter-spacing: .08em; padding: 7px 2px 6px; }
  .cmds button svg { width: 18px; height: 18px; }
  .mission { gap: 10px; padding: 7px 10px; }
  .mission i { width: 50px; }
}
@media (max-height: 520px) and (min-width: 641px) {
  .voice { height: 42px; } #say { -webkit-line-clamp: 1; line-clamp: 1; }
  .cmds button { padding-block: 5px; gap: 2px; } .cmds button svg { width: 15px; height: 15px; }
  .core-hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  body.awake .boot-in { animation: none; }
  #hud.jolt, #banner.on b { animation: none; }
}
</style>

<div id="stage">
  <canvas id="ui2d" aria-label="VEGA のホログラム。コアを長押しでチャージ、ドラッグで回転、タップで射撃"></canvas>

  <div id="hud">
    <header class="top boot-in" style="--d:.05s">
      <div class="brand">
        <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
          <path d="M20 2 36 11v18L20 38 4 29V11Z" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M20 9 30 15v10l-10 6-10-6V15Z" fill="none" stroke="currentColor" stroke-width="1" opacity=".6"/>
          <circle cx="20" cy="20" r="4" fill="currentColor"/>
        </svg>
        <div>
          <div class="logo">VEGA</div>
          <div class="sub">VIRTUAL ENGAGEMENT &amp; GUARDIAN ASSISTANT</div>
        </div>
      </div>
      <div class="status"><span class="dot"></span><span id="statusText">ONLINE</span></div>
      <div class="clock" id="clock">00:00:00</div>
      <div class="toggles">
        <button id="tSound" type="button" aria-pressed="true">SOUND</button>
        <button id="tVoice" type="button" aria-pressed="true">VOICE</button>
        <button id="tPower" type="button" aria-label="スリープ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
        </button>
      </div>
    </header>

    <div class="mission" id="mission" hidden>
      <b>DEFENSE</b>
      <span>撃墜 <em id="mKills">00</em></span>
      <span>SHIELD <em id="mShield">100</em>%</span>
      <i><s id="mTime"></s></i>
    </div>

    <div class="core-hint boot-in" style="--d:1s"><b>長押し</b> チャージ　<b>ドラッグ</b> 回転　<b>タップ</b> 射撃</div>

    <footer class="deck boot-in" style="--d:.5s">
      <div class="voice" id="voiceBar">
        <span class="who">VEGA</span>
        <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <p id="say" aria-live="polite"></p>
      </div>
      <nav class="cmds" aria-label="コマンド">
        <button type="button" data-cmd="scan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12 19 6"/></svg>
          <span>SCAN</span><small>スキャン</small>
        </button>
        <button type="button" data-cmd="overdrive">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 5 13h6l-1 9 8-11h-6z"/></svg>
          <span>OVERDRIVE</span><small>全出力</small>
        </button>
        <button type="button" data-cmd="defense">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
          <span>DEFENSE</span><small>迎撃戦</small>
        </button>
        <button type="button" data-cmd="transform">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7z"/><path d="M12 7v10M7.7 9.5l8.6 5M16.3 9.5l-8.6 5"/></svg>
          <span>TRANSFORM</span><small>変形</small>
        </button>
        <button type="button" data-cmd="globe">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 7h14M5 17h14"/></svg>
          <span>GLOBE</span><small>地球</small>
        </button>
        <button type="button" data-cmd="report">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M10 20V5M15 20v-7M20 20V8"/></svg>
          <span>REPORT</span><small>状況報告</small>
        </button>
      </nav>
    </footer>
  </div>

  <div id="banner"><b></b><small></small></div>
</div>

<div class="hazard top"></div>
<div class="hazard bottom"></div>
<div class="edge"></div>
<pre id="bootlog"></pre>

<button id="wake" type="button" aria-label="VEGA を起動する">
  <span class="w-top">VEGA LABS // SYSTEM STANDBY</span>
  <span class="w-logo">VEGA</span>
  <span class="w-cta"><b class="w-go">TOUCH TO WAKE</b><b class="w-load">INITIALIZING</b><small>タップして起動</small></span>
  <span class="w-nogl">この端末では 3D 表示（WebGL）が使えないため、VEGA を起動できません。</span>
  <span class="w-credit">SFX: KENNEY (CC0) · MAP: NATURAL EARTH</span>
</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="land.js"></script>
<script src="audio.js"></script>
<script src="main.js"></script>
</html>
